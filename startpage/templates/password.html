{% extends "base.html" %}
{% from "macros.html" import link %}
{% block content %}
<H2>Change password</H2>
<FORM METHOD="POST" ACTION="?show=main">
<INPUT TYPE="hidden" NAME="csrf" VALUE="{{ csrf_token() }}">
<INPUT TYPE="hidden" NAME="action" VALUE="submitchangepassword">
<TABLE BORDER="0" CELLSPACING="0">
<TR><TD><B>Current password</B></TD><TD><INPUT TYPE="password" SIZE="40" NAME="c_password"></TD></TR>
<TR><TD><B>New password</B></TD><TD><INPUT TYPE="password" SIZE="40" NAME="c_password1"></TD></TR>
<TR><TD><B>Verification</B></TD><TD><INPUT TYPE="password" SIZE="40" NAME="c_password2"></TD></TR>
</TABLE>
<INPUT TYPE="submit" VALUE="Change">
</FORM>
{% call link("Main", "?show=main") %}Main{% endcall %}
{% endblock %}
